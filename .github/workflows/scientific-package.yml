name: Scientific package
on:
  pull_request:
  push:
    branches: [data/scientific-package]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: pip install -r tools/requirements-lock.txt
      - run: npm ci --prefix tools
      - run: python tools/validate_package.py
      - run: node --test tests/runtime.test.mjs
